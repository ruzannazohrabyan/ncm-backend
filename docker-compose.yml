version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncmpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ncmdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncm} -d ${POSTGRES_DB:-ncmdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ncm}:${POSTGRES_PASSWORD:-ncmpassword}@db:5432/${POSTGRES_DB:-ncmdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - POSTGRES_USER=${POSTGRES_USER:-ncm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ncmpassword}
      - POSTGRES_DB=${POSTGRES_DB:-ncmdb}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@ncm.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin1234!}
      - SEED_ORG_NAME=${SEED_ORG_NAME:-My Organization}
      - SEED_ORG_SLUG=${SEED_ORG_SLUG:-my-org}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    entrypoint: ["celery", "-A", "app.workers.celery_app", "worker", "--pool=solo", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ncm}:${POSTGRES_PASSWORD:-ncmpassword}@db:5432/${POSTGRES_DB:-ncmdb}
      - DB_USE_NULL_POOL=true
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    restart: unless-stopped
    entrypoint: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ncm}:${POSTGRES_PASSWORD:-ncmpassword}@db:5432/${POSTGRES_DB:-ncmdb}
      - DB_USE_NULL_POOL=true
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - redis

volumes:
  postgres_data:
